name: Library token diff

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - ".agents/**"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  comment:
    name: Comment token diff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .devops/js-tools/package-lock.json

      - name: Install token tooling dependencies
        shell: bash
        run: npm ci --prefix .devops/js-tools

      - name: Build library token diff comment
        shell: bash
        run: >
          npm run token-diff:library --prefix .devops/js-tools --
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
          --output dist/LIBRARY_TOKEN_DIFF.md

      - name: Comment on pull request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const marker = "<!-- library-token-diff -->";
            const body = fs.readFileSync("dist/LIBRARY_TOKEN_DIFF.md", "utf8");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
