name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare dist directory
        shell: bash
        run: mkdir -p dist

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: dist/RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .devops/js-tools/package-lock.json

      - name: Install release tooling dependencies
        shell: bash
        run: npm ci --prefix .devops/js-tools

      - name: Generate token tally
        shell: bash
        run: npm run token-count --prefix .devops/js-tools -- --output-dir dist

      - name: Build library archive
        shell: bash
        run: |
          (cd .agents && zip -r ../dist/agent-md-library.zip . -x "*.DS_Store")

      - name: Prepare release assets
        shell: bash
        run: cp pages/PLAYBOOK.md dist/PLAYBOOK.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$TAG_NAME" \
            dist/agent-md-library.zip \
            dist/PLAYBOOK.md \
            dist/TOKEN_TALLY.md \
            dist/TOKEN_TALLY.json \
            --title "$TAG_NAME" \
            --notes-file dist/RELEASE_NOTES.md
