name: create-skill-evals
suites:
  routing:
    description: Trigger and route selection coverage for create-skill references.
    cases:
      create-new-skill:
        type: positive_trigger
        prompt: Create a skill for incident postmortems with a focused SKILL.md and only useful references.
        expected_output: Routes to authoring guidance and creates or revises skill instructions.
        files: []
        expect:
          routing:
            trigger: true
            reference: references/authoring.md
            evidence: routing_judge
          assertions:
            routes-to-authoring:
              text: The response uses references/authoring.md as the selected create-skill reference.
              kind: routing
              grading: transcript
              failure_mode: The request triggers create-skill but loads the wrong phase guidance.
            creates-focused-skill:
              text: The output defines or revises SKILL.md behavior, trigger description, and verification without placeholder bundled resources.
              kind: outcome
              grading: artifact
              failure_mode: The agent produces generic advice instead of concrete skill files or instructions.
      review-existing-skill:
        type: positive_trigger
        prompt: Review .agents/skills/data-cleanup before publishing and point out trigger, structure, safety, and eval issues.
        expected_output: Routes to review guidance and produces review findings grounded in the skill folder.
        files: []
        expect:
          routing:
            trigger: true
            reference: references/review.md
            evidence: routing_judge
          assertions:
            routes-to-review:
              text: The response uses references/review.md as the selected create-skill reference.
              kind: routing
              grading: transcript
              failure_mode: The agent treats a review request as authoring or evaluation work.
            leads-with-findings:
              text: The review leads with actionable findings tied to files or lines before summary context.
              kind: outcome
              grading: artifact
              failure_mode: The review gives broad impressions without inspectable evidence.
      generate-evals:
        type: positive_trigger
        prompt: Write evals for this skill from scratch in evals/evals.yaml and make sure the tests cover routing, process, and outcome.
        expected_output: Routes to evaluation guidance and writes schema-compliant skill-local evals.
        files: []
        expect:
          routing:
            trigger: true
            reference: references/evaluation.md
            evidence: routing_judge
          assertions:
            routes-to-evaluation:
              text: The response uses references/evaluation.md as the selected create-skill reference.
              kind: routing
              grading: transcript
              failure_mode: Eval generation is handled without the evaluation rules.
            writes-skill-local-yaml:
              text: The output creates or updates evals/evals.yaml inside the target skill folder.
              kind: outcome
              grading: deterministic
              failure_mode: The agent only describes evals or writes them outside the skill folder.
              check: file_exists
              path: evals/evals.yaml
            covers-three-layers:
              text: The eval suite includes routing, process, and outcome assertions.
              kind: eval_quality
              grading: deterministic
              failure_mode: The suite tests only happy-path prompts and misses workflow or result quality.
              check: assertion_kinds_present
              kinds:
                - routing
                - process
                - outcome
      optimize-description:
        type: positive_trigger
        prompt: Improve this skill description so it triggers for skill packaging requests but not generic archive creation.
        expected_output: Routes to description optimization guidance and improves trigger precision.
        files: []
        expect:
          routing:
            trigger: true
            reference: references/description-optimization.md
            evidence: routing_judge
          assertions:
            routes-to-description-optimization:
              text: The response uses references/description-optimization.md as the selected create-skill reference.
              kind: routing
              grading: transcript
              failure_mode: Trigger tuning is treated as general authoring instead of description optimization.
            tests-positive-and-negative-routing:
              text: The optimization considers both should-trigger and should-not-trigger examples.
              kind: process
              grading: transcript
              failure_mode: The description becomes broader because near-miss cases were not tested.
      validate-eval-schema:
        type: positive_trigger
        prompt: Validate this skill's evals.yaml schema and tell me which fields are invalid.
        expected_output: Routes to schema guidance and checks eval YAML structure.
        files: []
        expect:
          routing:
            trigger: true
            reference: references/schemas.md
            evidence: routing_judge
          assertions:
            routes-to-schemas:
              text: The response uses references/schemas.md as the selected create-skill reference.
              kind: routing
              grading: transcript
              failure_mode: Schema validation is performed from memory instead of the schema reference.
            checks-new-eval-contract:
              text: The validation checks suites, keyed cases, optional expect.routing, keyed expect.assertions, and assertion failure_mode.
              kind: outcome
              grading: artifact
              failure_mode: The validator accepts legacy reference or expectations fields.
      adapt-runtime-compatibility:
        type: positive_trigger
        prompt: Adapt this skill so it works in agents that cannot spawn subagents or expose skill-trigger event streams.
        expected_output: Routes to agent compatibility guidance and isolates runtime-specific behavior.
        files: []
        expect:
          routing:
            trigger: true
            reference: references/agent-compatibility.md
            evidence: routing_judge
          assertions:
            routes-to-agent-compatibility:
              text: The response uses references/agent-compatibility.md as the selected create-skill reference.
              kind: routing
              grading: transcript
              failure_mode: Runtime compatibility work is handled as ordinary authoring.
            preserves-portable-core:
              text: The update keeps the core workflow portable and isolates runtime-specific fallback behavior.
              kind: outcome
              grading: artifact
              failure_mode: The skill becomes tied to one CLI or UI capability.
  boundaries:
    description: Negative and near-miss cases that should not route into create-skill.
    cases:
      write-product-requirements:
        type: negative_trigger
        prompt: Write a PRD for a marketplace where users can browse and install agent skills.
        expected_output: Does not trigger create-skill; this is product requirements work.
        files: []
        expect:
          routing:
            trigger: false
            evidence: routing_judge
          assertions:
            avoids-product-doc-false-positive:
              text: The router does not select create-skill for product requirements about skills.
              kind: routing
              grading: deterministic
              failure_mode: Keyword overlap on "skills" causes create-skill to trigger for PRD writing.
      create-agent-rule:
        type: near_miss
        prompt: Create Cursor rules for how this repo should format API documentation.
        expected_output: Does not trigger create-skill; this is rule creation work.
        files: []
        expect:
          routing:
            trigger: false
            evidence: routing_judge
          assertions:
            avoids-rule-authoring-false-positive:
              text: The router does not select create-skill for repository rule authoring.
              kind: routing
              grading: deterministic
              failure_mode: The agent confuses rule creation with skill creation.
      use-existing-skill:
        type: negative_trigger
        prompt: Use the spreadsheets skill to build a budget workbook from this CSV.
        expected_output: Does not trigger create-skill; the user wants to use an existing skill.
        files: []
        expect:
          routing:
            trigger: false
            evidence: routing_judge
          assertions:
            avoids-existing-skill-use:
              text: The router does not select create-skill when the user wants to invoke another skill.
              kind: routing
              grading: deterministic
              failure_mode: The agent interprets any skill mention as a request to edit skills.
  schema-quality:
    description: Eval schema and assertion quality checks for generated eval suites.
    cases:
      reject-legacy-reference-field:
        type: regression
        prompt: Validate evals.yaml and fail any cases that still use a top-level reference field instead of expect.routing.reference.
        expected_output: Rejects legacy top-level routing fields.
        files:
          - evals/files/legacy-reference-evals.yaml
        expect:
          assertions:
            rejects-legacy-reference:
              text: The validator rejects cases that use top-level reference.
              kind: outcome
              grading: deterministic
              failure_mode: Legacy eval files pass validation after the schema changed.
              check: reject_field
              field: reference
            points-to-new-location:
              text: The error message tells the user to use expect.routing.reference.
              kind: outcome
              grading: deterministic
              failure_mode: The validator fails without giving a migration path.
              check: error_contains
              text: expect.routing.reference
      require-failure-mode:
        type: regression
        prompt: Validate evals.yaml and fail assertions that do not explain the failure mode they catch.
        expected_output: Rejects assertions without failure_mode.
        files:
          - evals/files/missing-failure-mode-evals.yaml
        expect:
          assertions:
            rejects-missing-failure-mode:
              text: The validator rejects every assertion without a non-empty failure_mode.
              kind: eval_quality
              grading: deterministic
              failure_mode: Vague assertions create false confidence because they do not name the bug they catch.
              check: required_field
              field: failure_mode
      allow-plain-skill-without-routing:
        type: robustness
        prompt: Generate evals for a plain single-file skill that has no references directory and only needs outcome checks.
        expected_output: Produces valid eval cases with expect.assertions and no expect.routing.
        files: []
        expect:
          assertions:
            omits-routing-when-not-needed:
              text: The eval case is valid without expect.routing when it tests process or outcome only.
              kind: outcome
              grading: deterministic
              failure_mode: Plain SKILL.md skills are forced to invent meaningless routing references.
              check: routing_optional
            keeps-assertions-keyed:
              text: Assertions are a mapping keyed by lowercase kebab-case assertion names.
              kind: eval_quality
              grading: deterministic
              failure_mode: The generated eval falls back to a list of vague expectation strings.
              check: assertions_are_mapping
  execution:
    description: Behavior expected from scripts that consume eval suites.
    cases:
      run-trigger-evals-from-routing:
        type: process
        prompt: Run trigger evaluation for this skill using evals/evals.yaml.
        expected_output: Uses only cases with expect.routing.trigger and derives query/should_trigger from prompt/routing.
        files: []
        expect:
          assertions:
            loads-routing-trigger-cases:
              text: The runner loads prompt as query and expect.routing.trigger as should_trigger.
              kind: process
              grading: deterministic
              failure_mode: The runner still expects legacy query and should_trigger fields.
              check: load_eval_set
            skips-non-routing-cases:
              text: The trigger runner skips process/outcome-only cases without expect.routing.trigger.
              kind: process
              grading: deterministic
              failure_mode: Non-routing cases crash trigger-only evaluation.
